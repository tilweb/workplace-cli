name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --all-extras --frozen
      - name: Ruff check
        run: uv run ruff check vibe/

  build-and-smoke:
    name: Build + Smoke-Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --all-extras --frozen
      - name: Build wheel
        run: uv build
      - name: Verify wheel name
        run: |
          set -e
          ls -l dist/
          test -f dist/workplace_cli-*.whl || (echo "::error::No workplace_cli wheel built"; exit 1)
      - name: Install built wheel into venv
        run: |
          uv pip install --no-deps dist/workplace_cli-*.whl
      - name: Smoke-Test — version + binary present
        run: |
          set -e
          echo "Testing 'workplace --version'"
          uv run workplace --version
          # Erwartete Version aus dem gebauten Wheel ableiten (kein hartkodierter
          # Wert) — verifiziert zugleich, dass --version == pyproject-Version.
          WHEEL=$(ls dist/workplace_cli-*.whl)
          VERSION=$(echo "$WHEEL" | sed -E 's/.*workplace_cli-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
          echo "Erwartete Version: $VERSION"
          uv run workplace --version | grep -qF "$VERSION" || (echo "::error::workplace --version zeigt nicht $VERSION"; exit 1)
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: workplace-cli-wheel
          path: dist/*.whl
          retention-days: 30

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --all-extras --frozen
      - name: Pyright
        run: uv run pyright vibe/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        run: uv sync --all-extras --frozen
      # Bulk suite in full parallelism. One rerun absorbs rare load hiccups.
      - name: Unit + integration tests (excl. snapshots)
        run: uv run pytest --ignore=tests/snapshots -n auto --reruns 1 --reruns-delay 1
      # UI snapshot tests render full Textual apps; under high parallelism they
      # hit the per-test timeout or capture an off-frame. Low parallelism plus
      # reruns keeps them a trustworthy signal (a real diff fails all attempts).
      # The screenshot render test self-skips when Chromium is not installed.
      - name: UI snapshot tests (low parallelism)
        run: uv run pytest tests/snapshots -n 2 --reruns 2 --reruns-delay 1
